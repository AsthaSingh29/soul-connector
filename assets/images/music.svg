<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#retroBg)" />
  <circle cx="400" cy="250" r="220" fill="url(#neonGlow)" />

  <!-- Vinyl Record -->
  <circle cx="400" cy="250" r="160" fill="#121517" stroke="#333A40" stroke-width="3" />
  <circle cx="400" cy="250" r="140" fill="none" stroke="#22282C" stroke-width="1.5" />
  <circle cx="400" cy="250" r="120" fill="none" stroke="#22282C" stroke-width="1.5" />
  <circle cx="400" cy="250" r="100" fill="none" stroke="#22282C" stroke-width="1.5" />
  <circle cx="400" cy="250" r="80" fill="none" stroke="#22282C" stroke-width="1.5" />

  <!-- Vinyl Center Label -->
  <circle cx="400" cy="250" r="58" fill="#FF5E3A" />
  <circle cx="400" cy="250" r="14" fill="#0F2027" />

  <text x="400" y="235" text-anchor="middle" fill="#FFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">STAND BY ME</text>
  <text x="400" y="275" text-anchor="middle" fill="#FFE5DB" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="1">HIGHWAY ROADTRIP MIX</text>

  <!-- Glowing Sound Waves -->
  <path d="M 120,250 Q 180,180 240,250 T 360,250" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.6" stroke-linecap="round" />
  <path d="M 440,250 Q 500,320 560,250 T 680,250" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.6" stroke-linecap="round" />

  <!-- Floating Musical Notes -->
  <text x="210" y="160" fill="#4FACFE" font-size="36" opacity="0.8">♪</text>
  <text x="590" y="170" fill="#00F2FE" font-size="44" opacity="0.8">♫</text>
  <text x="270" y="360" fill="#00F2FE" font-size="32" opacity="0.7">♩</text>
  <text x="540" y="350" fill="#4FACFE" font-size="40" opacity="0.7">♬</text>

  <!-- Title Badge -->
  <rect x="30" y="30" width="310" height="42" rx="21" fill="#0B161B" opacity="0.75" />
  <text x="50" y="56" fill="#FFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🎵 FAVORITE SONG: STAND BY ME</text>
</svg>
