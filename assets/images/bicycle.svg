<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50" />
      <stop offset="45%" stop-color="#4CA1AF" />
      <stop offset="75%" stop-color="#F3904F" />
      <stop offset="100%" stop-color="#3B4371" />
    </linearGradient>
    <radialGradient id="goldenGlow" cx="60%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFF2CC" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#twilightGrad)" />
  <circle cx="480" cy="270" r="180" fill="url(#goldenGlow)" />

  <!-- Park Lawn / Hill -->
  <path d="M 0,380 Q 300,320 800,360 L 800,500 L 0,500 Z" fill="#1A252F" />

  <!-- Silhouetted Park Trees -->
  <g fill="#111920">
    <ellipse cx="140" cy="280" rx="90" ry="110" />
    <rect x="132" y="360" width="16" height="60" />

    <ellipse cx="680" cy="260" rx="100" ry="130" />
    <rect x="672" y="350" width="16" height="70" />
  </g>

  <!-- Bicycle and Riding Daughter -->
  <g transform="translate(420, 270)">
    <!-- Bicycle Wheels -->
    <circle cx="40" cy="110" r="28" fill="none" stroke="#E0E6ED" stroke-width="4" />
    <circle cx="125" cy="110" r="28" fill="none" stroke="#E0E6ED" stroke-width="4" />
    <!-- Spokes -->
    <line x1="40" y1="82" x2="40" y2="138" stroke="#CCD1D9" stroke-width="1.5" />
    <line x1="12" y1="110" x2="68" y2="110" stroke="#CCD1D9" stroke-width="1.5" />
    <line x1="125" y1="82" x2="125" y2="138" stroke="#CCD1D9" stroke-width="1.5" />
    <line x1="97" y1="110" x2="153" y2="110" stroke="#CCD1D9" stroke-width="1.5" />

    <!-- Bicycle Frame -->
    <line x1="40" y1="110" x2="75" y2="78" stroke="#E74C3C" stroke-width="5" stroke-linecap="round" />
    <line x1="75" y1="78" x2="115" y2="78" stroke="#E74C3C" stroke-width="5" stroke-linecap="round" />
    <line x1="115" y1="78" x2="125" y2="110" stroke="#E74C3C" stroke-width="5" stroke-linecap="round" />
    <line x1="75" y1="78" x2="88" y2="110" stroke="#E74C3C" stroke-width="5" stroke-linecap="round" />
    <line x1="40" y1="110" x2="88" y2="110" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
    <!-- Handlebars -->
    <line x1="115" y1="78" x2="110" y2="60" stroke="#CCD1D9" stroke-width="4" />
    <line x1="104" y1="60" x2="122" y2="60" stroke="#333" stroke-width="6" stroke-linecap="round" />
    <!-- Seat -->
    <ellipse cx="75" cy="74" rx="10" ry="4" fill="#333" />

    <!-- Daughter on Bike -->
    <!-- Legs pedaling -->
    <line x1="75" y1="68" x2="80" y2="92" stroke="#111920" stroke-width="7" stroke-linecap="round" />
    <line x1="80" y1="92" x2="88" y2="108" stroke="#111920" stroke-width="6" stroke-linecap="round" />
    <!-- Torso -->
    <line x1="75" y1="68" x2="95" y2="42" stroke="#111920" stroke-width="10" stroke-linecap="round" />
    <!-- Arms holding bars -->
    <line x1="95" y1="42" x2="112" y2="60" stroke="#111920" stroke-width="5" stroke-linecap="round" />
    <!-- Head with helmet -->
    <circle cx="98" cy="26" r="11" fill="#111920" />
    <path d="M 88,24 Q 98,14 108,24 Z" fill="#F1C40F" />
  </g>

  <!-- Father standing behind, waving proud with hands open -->
  <g transform="translate(290, 260)" fill="#111920">
    <circle cx="40" cy="35" r="13" />
    <!-- Body -->
    <path d="M 28,48 C 25,65 24,95 24,120 L 56,120 C 56,95 55,65 52,48 Z" />
    <!-- Cheering arms! -->
    <line x1="30" y1="58" x2="15" y2="30" stroke="#111920" stroke-width="7" stroke-linecap="round" />
    <line x1="50" y1="58" x2="72" y2="35" stroke="#111920" stroke-width="7" stroke-linecap="round" />
    <!-- Legs -->
    <rect x="28" y="120" width="11" height="40" rx="3" />
    <rect x="42" y="120" width="11" height="40" rx="3" />
  </g>

  <!-- Title Badge -->
  <rect x="30" y="30" width="260" height="42" rx="21" fill="#0E1626" opacity="0.65" />
  <text x="50" y="56" fill="#FFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🚲 FIRST BICYCLE, 2010</text>
</svg>
