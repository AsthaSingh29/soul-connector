<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="40%" stop-color="#243B55" />
      <stop offset="70%" stop-color="#F27121" />
      <stop offset="100%" stop-color="#E94057" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#799F0C" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4E0" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFB347" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFCC33" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Morning Sun -->
  <circle cx="500" cy="240" r="140" fill="url(#sunGlow)" filter="url(#glow)" />
  <circle cx="500" cy="240" r="45" fill="#FFFCE6" />

  <!-- Distant Himalayan Peaks (Kanchenjunga) -->
  <polygon points="300,320 420,170 470,220 530,130 630,280 750,210 820,330" fill="#4B384C" opacity="0.65" />
  <polygon points="500,170 530,130 570,190" fill="#FFF" opacity="0.85" />
  <polygon points="400,200 420,170 440,200" fill="#FFF" opacity="0.8" />

  <!-- Midground Mountains -->
  <polygon points="120,380 280,260 410,360 550,270 700,380 800,340 800,500 0,500 0,420" fill="#251F38" opacity="0.85" />

  <!-- Mountain Valley Mist -->
  <ellipse cx="450" cy="350" rx="350" ry="35" fill="url(#mistGrad)" />
  <ellipse cx="250" cy="380" rx="280" ry="25" fill="url(#mistGrad)" />

  <!-- Foreground Mountain Ridge / Viewpoint -->
  <path d="M 0,400 Q 240,370 480,420 T 800,390 L 800,500 L 0,500 Z" fill="#0E0C17" />

  <!-- Pine Trees Silhouettes -->
  <path d="M 50,420 L 60,370 L 63,370 L 53,420 Z M 57,370 L 45,395 L 70,395 Z M 58,385 L 40,410 L 75,410 Z" fill="#08070D" />
  <path d="M 120,440 L 130,360 L 134,360 L 124,440 Z M 132,360 L 115,395 L 148,395 Z M 132,385 L 105,420 L 158,420 Z" fill="#08070D" />
  <path d="M 720,430 L 730,350 L 733,350 L 723,430 Z M 731,350 L 715,385 L 748,385 Z M 731,375 L 705,410 L 758,410 Z" fill="#08070D" />

  <!-- Father and Daughter Silhouette on Viewpoint -->
  <g transform="translate(340, 310)" fill="#08070D">
    <!-- Father -->
    <circle cx="45" cy="40" r="13" /> <!-- Head -->
    <path d="M 33,52 C 30,65 28,100 28,125 L 62,125 C 62,100 60,65 57,52 Z" /> <!-- Body / Jacket -->
    <path d="M 30,60 L 18,90 L 26,94 L 36,68 Z" /> <!-- Left arm -->
    <path d="M 55,60 C 65,70 78,80 82,92 L 76,96 C 72,85 62,75 53,65 Z" /> <!-- Right arm around daughter -->
    <rect x="32" y="125" width="12" height="35" rx="3" /> <!-- Left leg -->
    <rect x="47" y="125" width="12" height="35" rx="3" /> <!-- Right leg -->

    <!-- Daughter -->
    <circle cx="85" cy="65" r="10" /> <!-- Head -->
    <path d="M 75,76 C 72,85 70,110 70,130 L 98,130 C 98,110 96,85 93,76 Z" /> <!-- Body / Coat -->
    <path d="M 94,82 C 102,88 112,98 120,95 L 118,90 C 110,84 102,78 95,78 Z" /> <!-- Pointing at mountains -->
    <rect x="74" y="130" width="9" height="30" rx="2" />
    <rect x="85" y="130" width="9" height="30" rx="2" />
  </g>

  <!-- Title Badge on Image -->
  <rect x="30" y="30" width="230" height="42" rx="21" fill="#08070D" opacity="0.6" />
  <text x="50" y="56" fill="#FFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">📍 DARJEELING, 2018</text>
</svg>
