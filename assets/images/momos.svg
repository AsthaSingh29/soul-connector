<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1514" />
      <stop offset="50%" stop-color="#38211E" />
      <stop offset="100%" stop-color="#0F0A09" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD699" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="steamerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E5B37" />
      <stop offset="50%" stop-color="#BA8050" />
      <stop offset="100%" stop-color="#734727" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#warmBg)" />
  <circle cx="400" cy="220" r="260" fill="url(#lampGlow)" />

  <!-- Kitchen Wooden Counter -->
  <rect x="0" y="360" width="800" height="140" fill="#2E1B14" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#4A2F24" stroke-width="4" />

  <!-- Bamboo Steamer Basket -->
  <ellipse cx="400" cy="360" rx="190" ry="38" fill="#5E3821" />
  <path d="M 210,260 L 210,360 Q 400,430 590,360 L 590,260 Z" fill="url(#steamerGrad)" />
  <ellipse cx="400" cy="260" rx="190" ry="36" fill="#A36B40" stroke="#5E3821" stroke-width="4" />
  <ellipse cx="400" cy="260" rx="180" ry="32" fill="#80502E" />

  <!-- Steaming Dumplings / Momos -->
  <g fill="#FBF8EB" stroke="#DEC8AA" stroke-width="2">
    <!-- Momo 1 -->
    <ellipse cx="320" cy="260" rx="36" ry="24" />
    <path d="M 310,242 Q 320,230 330,242" fill="none" stroke="#C4A882" stroke-width="2.5" />
    <!-- Momo 2 -->
    <ellipse cx="400" cy="255" rx="38" ry="26" />
    <path d="M 390,235 Q 400,222 410,235" fill="none" stroke="#C4A882" stroke-width="2.5" />
    <!-- Momo 3 -->
    <ellipse cx="480" cy="260" rx="36" ry="24" />
    <path d="M 470,242 Q 480,230 490,242" fill="none" stroke="#C4A882" stroke-width="2.5" />
    <!-- Momo 4 -->
    <ellipse cx="360" cy="275" rx="35" ry="23" />
    <!-- Momo 5 -->
    <ellipse cx="440" cy="275" rx="35" ry="23" />
  </g>

  <!-- Spicy Chutney Bowl -->
  <ellipse cx="200" cy="380" rx="45" ry="22" fill="#B32428" stroke="#E0E6ED" stroke-width="4" />
  <ellipse cx="200" cy="378" rx="38" ry="16" fill="#D62828" />

  <!-- Rising Steam swirls -->
  <path d="M 330,220 Q 310,180 340,140 T 320,80" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.35" stroke-linecap="round" />
  <path d="M 400,210 Q 420,160 390,120 T 410,60" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.4" stroke-linecap="round" />
  <path d="M 470,220 Q 490,170 460,130 T 480,70" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.35" stroke-linecap="round" />

  <!-- Title Badge -->
  <rect x="30" y="30" width="280" height="42" rx="21" fill="#1C100E" opacity="0.75" />
  <text x="50" y="56" fill="#FFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">🥟 SUNDAY MOMO TRADITION</text>
</svg>
